name: E2E

# Läuft auf Self-Hosted-Runnern im Heimnetz (#163). Fork-Schutz deshalb in JEDEM Job:
# nur workflow_dispatch oder ein Label "e2e" an einem PR aus diesem Repo, nie aus einem Fork.
# Kein schedule (Entscheidung E6 in #163).
on:
  workflow_dispatch:
    inputs:
      vms:
        description: 'Test-VMs, kommagetrennt (a, b oder a,b). Nur mit a und b laufen T4/T5.'
        type: string
        default: 'a,b'
      produkt_ref:
        description: 'Tag oder voller Commit-SHA, aus dem Agent, Konfiguration und Installer gebaut werden (leer = dieser Stand). Die Tests kommen immer von diesem Stand.'
        type: string
        default: ''
      filter:
        description: 'Zusätzlicher dotnet-test-Filter, angehängt als &(…), z. B. Bereich=Basis|Bereich=R136'
        type: string
        default: ''
      zyklen:
        description: 'Zyklen für T10 (Regression #136), 1 bis 100'
        type: string
        default: '25'
  pull_request:
    types: [labeled]

permissions:
  contents: read

# Eine Umgebung auf PVE 2, ein Lauf zur Zeit; ein laufender Lauf wird nie abgebrochen,
# sonst bleiben die VMs an. Nur echte E2E-Läufe teilen sich die Gruppe: jedes andere Label
# erzeugt einen Lauf ohne Jobs, der sonst einen wartenden echten Lauf aus der Warteschlange verdrängt.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'e2e') && 'e2e-pve2' || format('e2e-noop-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  VMS: ${{ inputs.vms || 'a,b' }}

jobs:
  reset:
    name: VMs zurücksetzen
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'e2e' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, pve-orchestrator]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot clean-base, Start, Runner online
        run: |
          [[ "$VMS" =~ ^[ab](,[ab])*$ ]] || { echo "Ungültige Eingabe vms: $VMS" >&2; exit 2; }
          ids=()
          if [[ ",$VMS," == *,a,* ]]; then ids+=(9101); fi
          if [[ ",$VMS," == *,b,* ]]; then ids+=(9102); fi
          ci/e2e/pve-reset.sh "${ids[@]}"

  build:
    name: Installer und Tests bauen
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'e2e' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      INNO_VERSION: 7.1.1
      # innosetup-7.1.1-x64.exe, Digest laut GitHub-Release is-7_1_1 (jrsoftware/issrc).
      INNO_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0
    defaults:
      run:
        shell: pwsh
    outputs:
      produkt_ref: ${{ steps.lauf.outputs.produkt_ref }}
      filter: ${{ steps.lauf.outputs.filter }}
      zyklen: ${{ steps.lauf.outputs.zyklen }}
    steps:
      - uses: actions/checkout@v4

      # Werte nur über env und erst nach der Prüfung verwenden (Script-Injection). Beim Label-Lauf aus
      # ci/e2e/lauf.env: workflow_dispatch startet nur Workflows, die auf dem Default-Branch liegen.
      - name: Laufparameter
        id: lauf
        env:
          EREIGNIS: ${{ github.event_name }}
          IN_PRODUKT_REF: ${{ inputs.produkt_ref }}
          IN_FILTER: ${{ inputs.filter }}
          IN_ZYKLEN: ${{ inputs.zyklen }}
        run: |
          $werte = @{ PRODUKT_REF = "$env:IN_PRODUKT_REF"; FILTER = "$env:IN_FILTER"; ZYKLEN = "$env:IN_ZYKLEN" }
          if ($env:EREIGNIS -ne 'workflow_dispatch') {
              $werte = @{ PRODUKT_REF = ''; FILTER = ''; ZYKLEN = '' }
              foreach ($zeile in Get-Content -LiteralPath ci/e2e/lauf.env) {
                  if ($zeile -match '^\s*(#|$)') { continue }
                  if ($zeile -cnotmatch '^(PRODUKT_REF|FILTER|ZYKLEN)=(.*)$') { throw 'ci/e2e/lauf.env: nur PRODUKT_REF=, FILTER= und ZYKLEN= sind erlaubt.' }
                  $werte[$Matches[1]] = $Matches[2].Trim()
              }
          }
          if ($werte.PRODUKT_REF -cnotmatch '^[A-Za-z0-9._/-]*$' -or $werte.PRODUKT_REF.StartsWith('-')) { throw 'produkt_ref: nur A-Z, a-z, 0-9, ".", "_", "/" und "-" erlaubt.' }
          if ($werte.FILTER -cnotmatch '^[A-Za-z0-9=!&|()_.~-]*$') { throw 'filter: nur A-Z, a-z, 0-9 und =!&|()_.~- erlaubt.' }
          if (-not $werte.ZYKLEN) { $werte.ZYKLEN = '25' }
          if ($werte.ZYKLEN -cnotmatch '^[0-9]{1,3}$' -or [int]$werte.ZYKLEN -lt 1 -or [int]$werte.ZYKLEN -gt 100) { throw 'zyklen: ganze Zahl von 1 bis 100.' }
          "produkt_ref=$($werte.PRODUKT_REF)" >> $env:GITHUB_OUTPUT
          "filter=$($werte.FILTER)" >> $env:GITHUB_OUTPUT
          "zyklen=$($werte.ZYKLEN)" >> $env:GITHUB_OUTPUT
          $quelle = if ($werte.PRODUKT_REF) { Join-Path $PWD 'produkt' } else { "$PWD" }
          "QUELLE=$quelle" >> $env:GITHUB_ENV
          $produkt = if ($werte.PRODUKT_REF) { $werte.PRODUKT_REF } else { '(dieser Stand)' }
          "### E2E-Laufparameter`n`n- produkt_ref: $produkt`n- filter: $($werte.FILTER)`n- zyklen: $($werte.ZYKLEN)" >> $env:GITHUB_STEP_SUMMARY

      # Agent, Konfiguration und Installer aus einem anderen Stand (Vergleichslauf, z. B. v0.46.1 für #136).
      - name: Produktstand auschecken
        if: steps.lauf.outputs.produkt_ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.lauf.outputs.produkt_ref }}
          path: produkt

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Befehle wie in docs/handbuch/entwickler-bauen-und-installieren.md.
      - name: Nutzlast veröffentlichen
        run: |
          foreach ($p in 'HaelpMi.Agent', 'HaelpMi.Config', 'HaelpMi.UpdateService') {
              dotnet publish "$env:QUELLE/src/$p/$p.csproj" -c Release -r win-x64 -p:Platform=x64 --self-contained true -p:PublishReadyToRun=true -o "$env:QUELLE/installer/payload"
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Inno Setup installieren (Prüfsumme wird verifiziert)
        run: |
          $datei = "innosetup-$env:INNO_VERSION-x64.exe"
          $tag = 'is-' + ($env:INNO_VERSION -replace '\.', '_')
          $pfad = Join-Path $env:RUNNER_TEMP $datei
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/$tag/$datei" -OutFile $pfad
          $ist = (Get-FileHash $pfad -Algorithm SHA256).Hash
          if ($ist -ne $env:INNO_SHA256) { throw "SHA256 von $datei ist $ist, erwartet $env:INNO_SHA256" }
          $ziel = Join-Path $env:RUNNER_TEMP 'inno'
          # Kein -Wait: in PowerShell 7 wartet es auf den ganzen Prozessbaum und kann hängen bleiben.
          $p = Start-Process $pfad -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$ziel`"" -PassThru
          $p.WaitForExit()
          if ($p.ExitCode) { throw "Inno-Setup-Installation endete mit $($p.ExitCode)" }
          $iscc = Join-Path $ziel 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "$iscc fehlt" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      # Eigene Test-Kundengruppe pro Lauf mit Lizenz, siehe Kopf von testlizenz-erzeugen.ps1.
      - name: Testlizenz erzeugen
        id: lizenz
        run: ci/e2e/testlizenz-erzeugen.ps1 -Payload "$env:QUELLE/installer/payload" -Ausgabe e2e-installer/lizenz.json

      # User vor Admin: der Admin-Installer bettet installer/UserInstallerPayload/HaelpMi-User-Setup.exe ein.
      # Ohne /DCustomerGroupId gilt im Installer die Null-GUID, deren Nachrichten MessageValidation.IsPlausible verwirft.
      - name: Installer kompilieren
        env:
          GRUPPE: ${{ steps.lizenz.outputs.customer_group_id }}
          SCHLUESSEL: ${{ steps.lizenz.outputs.license_public_key_hex }}
        run: |
          $g = [guid]::Empty
          if (-not [guid]::TryParse($env:GRUPPE, [ref]$g) -or $g -eq [guid]::Empty) { throw "Keine gültige CustomerGroupId aus der Testlizenz: '$env:GRUPPE'" }
          if ($env:SCHLUESSEL -notmatch '^[0-9A-Fa-f]{64}$') { throw 'Kein gültiger Lizenzschlüssel aus der Testlizenz.' }
          $gemeinsam = "/DCustomerGroupId=$env:GRUPPE", '/DIsTestInstaller=true', "/DLicensePublicKeyHex=$env:SCHLUESSEL"
          $q = $env:QUELLE
          & $env:ISCC @gemeinsam "/O$q\installer\UserInstallerPayload" /FHaelpMi-User-Setup "$q\installer\HaelpMi.iss"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path "$q\installer\UserInstallerPayload\HaelpMi-User-Setup.exe")) { throw 'User-Installer fehlt in installer\UserInstallerPayload, der Admin-Installer würde ohne ihn scheitern.' }
          & $env:ISCC @gemeinsam "/O$PWD\e2e-installer\a" /FHaelpMi-Admin-Setup "$q\installer\HaelpMi-Admin.iss"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path e2e-installer/b | Out-Null
          Copy-Item "$q\installer\UserInstallerPayload\HaelpMi-User-Setup.exe" e2e-installer/b/
          foreach ($datei in 'lizenz.json', 'lizenz-bald.json', 'lizenz-abgelaufen.json') {
              Copy-Item "e2e-installer/$datei" e2e-installer/a/
              Copy-Item "e2e-installer/$datei" e2e-installer/b/
          }

      - name: E2E-Tests bauen
        run: dotnet build tests/HaelpMi.E2E.Tests -c Release

      # Je VM ein eigenes Artefakt: die VMs laden mit wenigen hundert KB/s, der Admin-Installer
      # enthält den User-Installer schon, A braucht ihn nicht ein zweites Mal.
      - uses: actions/upload-artifact@v4
        with:
          name: installer-a
          path: e2e-installer/a/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: installer-b
          path: e2e-installer/b/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-tests
          path: tests/HaelpMi.E2E.Tests/bin/Release/net10.0-windows/
          if-no-files-found: error
          retention-days: 3

  test-a:
    name: Tests auf VM A (Admin)
    needs: [reset, build]
    if: (github.event_name == 'workflow_dispatch' || (github.event.label.name == 'e2e' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(format(',{0},', inputs.vms || 'a,b'), ',a,')
    runs-on: [self-hosted, haelpmi-e2e, vm-a]
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      HAELPMI_E2E_DIR: C:\haelpmi-e2e
      HAELPMI_E2E_INSTALLER: C:\haelpmi-e2e\installer\HaelpMi-Admin-Setup.exe
      HAELPMI_E2E_LIZENZ: C:\haelpmi-e2e\installer\lizenz.json
      HAELPMI_E2E_RAUM: E2E-A
      HAELPMI_E2E_RAUMNUMMER: '101'
      HAELPMI_E2E_PRODUKT_REF: ${{ needs.build.outputs.produkt_ref }}
      HAELPMI_E2E_ZYKLEN: ${{ needs.build.outputs.zyklen }}
      E2E_FILTER: ${{ needs.build.outputs.filter }}
      GERAET: A
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer-a
          path: C:\haelpmi-e2e\installer
      - uses: actions/download-artifact@v4
        with:
          name: e2e-tests
          path: C:\haelpmi-e2e\tests
      # Testvorbereitung, Umgehung eines Produktbefunds: beim ersten Agent-Start fragt die Windows-Firewall
      # nach einer Freigabe für HaelpMi.Agent.exe: der Admin-Installer legt nur Portregeln für 51500/51501 an,
      # nicht für 51502–51506, der User-Installer gar keine. Der Dialog verdeckt das Alarmfenster. Die Programmregel
      # ersetzt keine Produktkorrektur; sie lebt nur bis zum nächsten Reset auf clean-base.
      - name: Testvorbereitung – Firewall-Freigabe für den Agent (Umgehung)
        run: |
          $name = 'HaelpMi E2E Agent (Testvorbereitung)'
          Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          New-NetFirewallRule -DisplayName $name -Direction Inbound -Action Allow -Profile Any `
              -Program 'C:\Program Files\HaelpMi\HaelpMi.Agent.exe' | Out-Null
      # Ebenfalls Umgehung eines Produktbefunds: das Konfigurationsprogramm (Admin-Dashboard) öffnet selbst Sockets
      # für Config-Sync und Edit-Lock (UDP 51502), ohne dass ein Installer dafür eine Regel anlegt.
      - name: Testvorbereitung – Firewall-Freigabe für das Konfigurationsprogramm (Umgehung)
        run: |
          $name = 'HaelpMi E2E Config (Testvorbereitung)'
          Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          New-NetFirewallRule -DisplayName $name -Direction Inbound -Action Allow -Profile Any `
              -Program 'C:\Program Files\HaelpMi\HaelpMi.Config.exe' | Out-Null
      - name: E2E-Tests
        run: |
          $filter = "Category=E2E&Geraet=$env:GERAET"
          if (",$env:VMS," -notlike '*,a,*' -or ",$env:VMS," -notlike '*,b,*') { $filter += '&Teil!=ZweiGeraete' }
          if ($env:E2E_FILTER) {
              if ($env:E2E_FILTER -cnotmatch '^[A-Za-z0-9=!&|()_.~-]*$') { throw 'Ungültiger Filter aus dem Build-Job.' }
              $filter += "&($env:E2E_FILTER)"
          }
          "Filter: $filter"
          dotnet test "$env:HAELPMI_E2E_DIR\tests\HaelpMi.E2E.Tests.dll" --filter $filter `
              --logger "trx;LogFileName=e2e-$env:GERAET.trx" --results-directory "$env:HAELPMI_E2E_DIR\out\trx"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # Beendet das Relay auf dem Orchestrator, auch nach einem Fehlschlag.
      - name: Ende melden
        if: always()
        run: |
          $rv = Join-Path $env:HAELPMI_E2E_DIR 'rv'
          New-Item -ItemType Directory -Force -Path $rv | Out-Null
          $tmp = Join-Path $rv ".ende.$([guid]::NewGuid().ToString('N')).tmp"
          Set-Content -LiteralPath $tmp -Value '' -NoNewline
          Move-Item -LiteralPath $tmp -Destination (Join-Path $rv "$($env:GERAET.ToLower())-ende") -Force
      # upload-artifact nimmt hier nur Pfade unterhalb des Workspace an.
      - name: Ergebnisse einsammeln
        if: always()
        run: |
          $ziel = Join-Path $env:GITHUB_WORKSPACE 'e2e-out'
          New-Item -ItemType Directory -Force -Path (Join-Path $ziel 'programdata') | Out-Null
          if (Test-Path "$env:HAELPMI_E2E_DIR\out") { Copy-Item "$env:HAELPMI_E2E_DIR\out\*" $ziel -Recurse -Force }
          Copy-Item "$env:ProgramData\HaelpMi\*.log" (Join-Path $ziel 'programdata') -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-a
          path: e2e-out/
          if-no-files-found: warn

  test-b:
    name: Tests auf VM B (User)
    needs: [reset, build]
    if: (github.event_name == 'workflow_dispatch' || (github.event.label.name == 'e2e' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(format(',{0},', inputs.vms || 'a,b'), ',b,')
    runs-on: [self-hosted, haelpmi-e2e, vm-b]
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      HAELPMI_E2E_DIR: C:\haelpmi-e2e
      HAELPMI_E2E_INSTALLER: C:\haelpmi-e2e\installer\HaelpMi-User-Setup.exe
      HAELPMI_E2E_LIZENZ: C:\haelpmi-e2e\installer\lizenz.json
      HAELPMI_E2E_RAUM: E2E-B
      HAELPMI_E2E_RAUMNUMMER: '102'
      HAELPMI_E2E_PRODUKT_REF: ${{ needs.build.outputs.produkt_ref }}
      HAELPMI_E2E_ZYKLEN: ${{ needs.build.outputs.zyklen }}
      E2E_FILTER: ${{ needs.build.outputs.filter }}
      GERAET: B
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer-b
          path: C:\haelpmi-e2e\installer
      - uses: actions/download-artifact@v4
        with:
          name: e2e-tests
          path: C:\haelpmi-e2e\tests
      # Testvorbereitung, Umgehung eines Produktbefunds: beim ersten Agent-Start fragt die Windows-Firewall
      # nach einer Freigabe für HaelpMi.Agent.exe: der Admin-Installer legt nur Portregeln für 51500/51501 an,
      # nicht für 51502–51506, der User-Installer gar keine. Der Dialog verdeckt das Alarmfenster. Die Programmregel
      # ersetzt keine Produktkorrektur; sie lebt nur bis zum nächsten Reset auf clean-base.
      - name: Testvorbereitung – Firewall-Freigabe für den Agent (Umgehung)
        run: |
          $name = 'HaelpMi E2E Agent (Testvorbereitung)'
          Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          New-NetFirewallRule -DisplayName $name -Direction Inbound -Action Allow -Profile Any `
              -Program 'C:\Program Files\HaelpMi\HaelpMi.Agent.exe' | Out-Null
      # Ebenfalls Umgehung eines Produktbefunds: das Konfigurationsprogramm (Admin-Dashboard) öffnet selbst Sockets
      # für Config-Sync und Edit-Lock (UDP 51502), ohne dass ein Installer dafür eine Regel anlegt.
      - name: Testvorbereitung – Firewall-Freigabe für das Konfigurationsprogramm (Umgehung)
        run: |
          $name = 'HaelpMi E2E Config (Testvorbereitung)'
          Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          New-NetFirewallRule -DisplayName $name -Direction Inbound -Action Allow -Profile Any `
              -Program 'C:\Program Files\HaelpMi\HaelpMi.Config.exe' | Out-Null
      - name: E2E-Tests
        run: |
          $filter = "Category=E2E&Geraet=$env:GERAET"
          if (",$env:VMS," -notlike '*,a,*' -or ",$env:VMS," -notlike '*,b,*') { $filter += '&Teil!=ZweiGeraete' }
          if ($env:E2E_FILTER) {
              if ($env:E2E_FILTER -cnotmatch '^[A-Za-z0-9=!&|()_.~-]*$') { throw 'Ungültiger Filter aus dem Build-Job.' }
              $filter += "&($env:E2E_FILTER)"
          }
          "Filter: $filter"
          dotnet test "$env:HAELPMI_E2E_DIR\tests\HaelpMi.E2E.Tests.dll" --filter $filter `
              --logger "trx;LogFileName=e2e-$env:GERAET.trx" --results-directory "$env:HAELPMI_E2E_DIR\out\trx"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Ende melden
        if: always()
        run: |
          $rv = Join-Path $env:HAELPMI_E2E_DIR 'rv'
          New-Item -ItemType Directory -Force -Path $rv | Out-Null
          $tmp = Join-Path $rv ".ende.$([guid]::NewGuid().ToString('N')).tmp"
          Set-Content -LiteralPath $tmp -Value '' -NoNewline
          Move-Item -LiteralPath $tmp -Destination (Join-Path $rv "$($env:GERAET.ToLower())-ende") -Force
      # upload-artifact nimmt hier nur Pfade unterhalb des Workspace an.
      - name: Ergebnisse einsammeln
        if: always()
        run: |
          $ziel = Join-Path $env:GITHUB_WORKSPACE 'e2e-out'
          New-Item -ItemType Directory -Force -Path (Join-Path $ziel 'programdata') | Out-Null
          if (Test-Path "$env:HAELPMI_E2E_DIR\out") { Copy-Item "$env:HAELPMI_E2E_DIR\out\*" $ziel -Recurse -Force }
          Copy-Item "$env:ProgramData\HaelpMi\*.log" (Join-Path $ziel 'programdata') -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-b
          path: e2e-out/
          if-no-files-found: warn

  # Spiegelt die Rendezvous-Marken zwischen A und B, bis beide "ende" gemeldet haben.
  # Wartet auch auf build: scheitert der Build, starten keine Tests und das Relay liefe ins Zeitlimit.
  koordination:
    name: Rendezvous-Relay
    needs: [reset, build]
    if: (github.event_name == 'workflow_dispatch' || (github.event.label.name == 'e2e' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(format(',{0},', inputs.vms || 'a,b'), ',a,') && contains(format(',{0},', inputs.vms || 'a,b'), ',b,')
    runs-on: [self-hosted, pve-orchestrator]
    timeout-minutes: 125
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Läuft ab Start der Test-Jobs, also auch während deren Artefakt-Downloads (im ersten Lauf ~22 min).
      - run: ci/e2e/rendezvous-relay.sh --timeout 120 9101 9102

  stop:
    name: VMs herunterfahren
    needs: [reset, test-a, test-b, koordination]
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event.label.name == 'e2e' && github.event.pull_request.head.repo.full_name == github.repository)) && needs.reset.result != 'skipped'
    runs-on: [self-hosted, pve-orchestrator]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Herunterfahren
        run: |
          [[ "$VMS" =~ ^[ab](,[ab])*$ ]] || { echo "Ungültige Eingabe vms: $VMS" >&2; exit 2; }
          ids=()
          if [[ ",$VMS," == *,a,* ]]; then ids+=(9101); fi
          if [[ ",$VMS," == *,b,* ]]; then ids+=(9102); fi
          ci/e2e/pve-stop.sh "${ids[@]}"
