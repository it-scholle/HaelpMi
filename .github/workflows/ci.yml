name: CI

on:
  pull_request:
  push:
    branches: [main, 'release-*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build und Tests (Windows)
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore HaelpMi.sln
      - run: dotnet build HaelpMi.sln -c Release --no-restore
      # HaelpMi.Installer.Tests fehlt hier absichtlich: verändert das ausführende System.
      - run: dotnet test tests/HaelpMi.Core.Tests -c Release --no-build --logger "console;verbosity=normal"
      - run: dotnet test tests/HaelpMi.InstallCreator.Tests -c Release --no-build --logger "console;verbosity=normal"

  # Prüft, dass ISPP (installer/HaelpMiVersion.iss.inc) dieselbe Version aus
  # Directory.Build.props liest wie MSBuild. Inno Setup wie in e2e.yml (gleiche Version und Prüfsumme).
  installer-version:
    name: Installer-Version (ISPP)
    runs-on: windows-latest
    env:
      INNO_VERSION: 7.1.1
      INNO_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Inno Setup installieren (Prüfsumme wird verifiziert)
        run: |
          $datei = "innosetup-$env:INNO_VERSION-x64.exe"
          $tag = 'is-' + ($env:INNO_VERSION -replace '\.', '_')
          $pfad = Join-Path $env:RUNNER_TEMP $datei
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/$tag/$datei" -OutFile $pfad
          $ist = (Get-FileHash $pfad -Algorithm SHA256).Hash
          if ($ist -ne $env:INNO_SHA256) { throw "SHA256 von $datei ist $ist, erwartet $env:INNO_SHA256" }
          $ziel = Join-Path $env:RUNNER_TEMP 'inno'
          $p = Start-Process $pfad -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$ziel`"" -PassThru
          $p.WaitForExit()
          if ($p.ExitCode) { throw "Inno-Setup-Installation endete mit $($p.ExitCode)" }
          "ISCC=$(Join-Path $ziel 'ISCC.exe')" >> $env:GITHUB_ENV
      - name: Version vergleichen
        run: |
          $erwartet = (Select-Xml -Path Directory.Build.props -XPath '/Project/PropertyGroup/Version').Node.InnerText
          if (-not $erwartet) { throw 'Keine Version in Directory.Build.props.' }
          # Prüfskript neben den echten Skripten, damit SourcePath wie beim Installer-Build auf installer\ zeigt.
          $skript = Join-Path $PWD 'installer\ci-versionspruefung.iss'
          Set-Content -LiteralPath $skript -Encoding utf8 -Value @(
              '#include "HaelpMiVersion.iss.inc"'
              '#if MyAppVersion != Erwartet'
              '  #error ISPP liest eine andere Version als Directory.Build.props'
              '#endif'
              '[Setup]'
              'AppName=Versionspruefung'
              'AppVersion={#MyAppVersion}'
              'DefaultDirName={autopf}\Versionspruefung'
              'Output=no'
          )
          & $env:ISCC "/DErwartet=$erwartet" $skript
          if ($LASTEXITCODE) { throw "ISCC endete mit $LASTEXITCODE (erwartet: $erwartet)" }

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks installieren (Prüfsumme wird verifiziert)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$file"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" gitleaks
      - run: ./gitleaks git --redact --verbose --no-banner .
