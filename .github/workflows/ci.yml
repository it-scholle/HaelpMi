name: CI

on:
  pull_request:
  push:
    branches: [main, 'release-*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build und Tests (Windows)
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore HaelpMi.sln
      - run: dotnet build HaelpMi.sln -c Release --no-restore
      # HaelpMi.Installer.Tests fehlt hier absichtlich: verändert das ausführende System.
      - run: dotnet test tests/HaelpMi.Core.Tests -c Release --no-build --logger "console;verbosity=normal"
      - run: dotnet test tests/HaelpMi.InstallCreator.Tests -c Release --no-build --logger "console;verbosity=normal"

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks installieren (Prüfsumme wird verifiziert)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$file"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" gitleaks
      - run: ./gitleaks git --redact --verbose --no-banner .
